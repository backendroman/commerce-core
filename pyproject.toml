[project]
name = "sales-api"
version = "0.1.0"
description = "Online store domain core: catalog, pricing, inventory, checkout, orders."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=42",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=8",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sales_api"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "B", "A", "I", "UP", "SIM", "RET", "C4", "PIE", "PERF", "PLE", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/sales_api/common/slug.py" = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["sales_api", "support"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disable_error_code = ["type-abstract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
